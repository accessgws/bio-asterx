<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050209">
<title>Morcego ASTERX</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23050209'/%3E%3Cpath d='M32 23c-3 0-5 2-6 4-5-6-13-7-20-3 4 4 5 9 4 14 5-2 10-1 13 3 2-2 6-3 9-3s7 1 9 3c3-4 8-5 13-3-1-5 0-10 4-14-7-4-15-3-20 3-1-2-3-4-6-4z' fill='%23c084fc'/%3E%3C/svg%3E">

<!-- Tipografia Oficial Geist -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    color-scheme: dark;
    --font-sans: "Geist", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100svh;
    display: grid;
    place-items: center;
    background: radial-gradient(ellipse at 50% 20%, #170624 0%, #050209 68%);
    color: #f7eaff;
    font: 16px var(--font-sans);
    padding: 1.5rem 1rem;
    overflow-x: hidden;
  }
  main {
    width: min(92vw, 620px);
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .nav-top {
    width: 100%;
    display: flex;
    justify-content: flex-start;
    margin-bottom: 1.5rem;
  }
  .btn-back {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    background: rgba(33, 17, 50, 0.7);
    border: 1px solid rgba(189, 76, 255, 0.35);
    color: #c9b3dc;
    border-radius: 0.85rem;
    padding: 0.5rem 0.95rem;
    font: 500 0.86rem var(--font-sans);
    text-decoration: none;
    backdrop-filter: blur(8px);
    transition: all 0.2s ease;
  }
  .btn-back:hover {
    color: #fff;
    border-color: #bd4cff;
    background: rgba(54, 23, 85, 0.85);
    box-shadow: 0 0 15px rgba(189, 76, 255, 0.3);
    transform: translateX(-2px);
  }
  .stage {
    width: 100%;
    position: relative;
    cursor: pointer;
    user-select: none;
  }
  svg {
    display: block;
    width: 100%;
    height: auto;
    overflow: visible;
    background: radial-gradient(ellipse, #38104c80, transparent 66%);
    filter: drop-shadow(0 0 8px rgba(189, 76, 255, 0.2));
    transition: transform 0.2s ease;
  }
  .stage:hover svg {
    transform: scale(1.02);
  }
  #rastro { filter: drop-shadow(0 0 4px #bb48f9); }
  #silhueta { filter: drop-shadow(0 0 6px #b42dfb) drop-shadow(0 0 14px #ad22e68a); }
  
  .hint-tap {
    margin-top: 1.25rem;
    font-size: 0.85rem;
    color: #b79cc9;
    opacity: 0.8;
  }

  /* Acrobacia ao clicar */
  .stage.do-flip svg {
    animation: bat-acrobat 0.75s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes bat-acrobat {
    0% { transform: scale(1) rotate(0deg); }
    40% { transform: scale(1.22) rotate(-180deg); filter: drop-shadow(0 0 20px #e084ff); }
    100% { transform: scale(1) rotate(-360deg); }
  }

  @media (prefers-reduced-motion: reduce) {
    .stage svg {
      transition: none;
    }
    .stage.do-flip svg {
      animation: none;
    }
  }
</style>
</head>
<body>
<main>
  <div class="nav-top">
    <a href="index.html" class="btn-back">
      <span aria-hidden="true">←</span>
      <span>Voltar ao perfil</span>
    </a>
  </div>

  <div class="stage" title="Clique para uma acrobacia!">
    <svg id="morcego-svg" class="bat-svg" viewBox="0 0 440 250" role="img" aria-label="Morcego ASTERX de contorno roxo e asas angulares">
      <ellipse id="sombra" cx="220" cy="216" rx="62" ry="6" fill="#060309" opacity=".55"/>
      <g id="morcego">
        <path id="rastro" fill="none" stroke="#dc87ff" stroke-width="2.4" stroke-linecap="round" opacity="0"/>
        <path id="silhueta" fill="#1b0b29" stroke="#d749ff" stroke-width="4" stroke-linejoin="round"
          d="M220 192 C182 148 150 114 115 141 Q92 100 32 146 L47 98 L106 31 L179 78 L184 32 L202 56 H238 L256 32 L261 78 L334 31 L393 98 L408 146 Q348 100 325 141 C290 114 258 148 220 192Z"/>
        <path id="olhos" fill="#f9d9ff" d="m191 80 16 10-11-1zm58 0-16 10 11-1z"/>
      </g>
    </svg>
    <p class="hint-tap">✦ Clique ou toque no morcego para uma acrobacia</p>
  </div>
</main>
<script type="module" src="./bat.js"></script>
</body>
</html>
