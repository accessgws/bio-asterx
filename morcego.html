<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050209">
<title>Morcego ASTERX</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23050209'/%3E%3Cpath d='M32 23c-3 0-5 2-6 4-5-6-13-7-20-3 4 4 5 9 4 14 5-2 10-1 13 3 2-2 6-3 9-3s7 1 9 3c3-4 8-5 13-3-1-5 0-10 4-14-7-4-15-3-20 3-1-2-3-4-6-4z' fill='%23c084fc'/%3E%3C/svg%3E">

<!-- Tipografia Oficial Geist -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    color-scheme: dark;
    --font-sans: "Geist", system-ui, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100svh;
    display: grid;
    place-items: center;
    background: radial-gradient(ellipse at 50% 20%, #170624 0%, #050209 68%);
    color: #f7eaff;
    font: 16px var(--font-sans);
    padding: 1.5rem 1rem;
    overflow-x: hidden;
  }
  .stardust {
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background-image:
      radial-gradient(1px 1px at 30px 40px, rgba(233, 179, 255, 0.24), transparent),
      radial-gradient(1.2px 1.2px at 180px 220px, rgba(255, 255, 255, 0.24), transparent),
      radial-gradient(1px 1px at 340px 90px, rgba(189, 76, 255, 0.2), transparent),
      radial-gradient(1px 1px at 520px 380px, rgba(255, 255, 255, 0.22), transparent),
      radial-gradient(1.2px 1.2px at 700px 180px, rgba(200, 140, 255, 0.2), transparent);
    background-size: 800px 600px;
    opacity: 0.42;
  }
  main {
    width: min(92vw, 620px);
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .nav-top {
    width: 100%;
    display: flex;
    justify-content: flex-start;
    margin-bottom: 1.5rem;
  }
  .btn-back {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    background: rgba(33, 17, 50, 0.7);
    border: 1px solid rgba(189, 76, 255, 0.35);
    color: #c9b3dc;
    border-radius: 0.85rem;
    padding: 0.5rem 0.95rem;
    font: 500 0.86rem var(--font-sans);
    text-decoration: none;
    backdrop-filter: blur(8px);
    transition: all 0.2s ease;
  }
  .btn-back:hover {
    color: #fff;
    border-color: #bd4cff;
    background: rgba(54, 23, 85, 0.85);
    box-shadow: 0 0 15px rgba(189, 76, 255, 0.3);
    transform: translateX(-2px);
  }
  .stage {
    width: 100%;
    position: relative;
    padding: clamp(1.25rem, 4vw, 2rem) 1.15rem clamp(1.4rem, 4vw, 2rem);
    border-radius: 1.55rem;
    border: 1px solid rgba(189, 76, 255, 0.22);
    background: radial-gradient(circle at 50% 38%, rgba(44, 14, 68, 0.34), rgba(9, 3, 15, 0.72) 72%);
    box-shadow: 0 24px 64px rgba(0, 0, 0, 0.75), inset 0 1px 0 rgba(255, 255, 255, 0.05);
    overflow: hidden;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    outline: none;
  }
  .stage::before {
    content: "";
    position: absolute;
    top: 38%;
    left: 50%;
    width: min(74vw, 340px);
    aspect-ratio: 1;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    border: 1px solid rgba(189, 76, 255, 0.16);
    background: radial-gradient(circle, rgba(189, 76, 255, 0.12), transparent 68%);
    box-shadow: 0 0 40px rgba(189, 76, 255, 0.14);
    pointer-events: none;
  }
  svg {
    display: block;
    width: 100%;
    height: auto;
    overflow: visible;
    filter: drop-shadow(0 0 8px rgba(189, 76, 255, 0.22));
    transition: transform 0.2s ease;
  }
  .stage:hover svg {
    transform: scale(1.02);
  }
  #rastro { filter: drop-shadow(0 0 4px #bb48f9); }
  #silhueta { filter: drop-shadow(0 0 6px #b42dfb) drop-shadow(0 0 14px #ad22e68a); }
  
  .hint-tap {
    margin-top: 1.05rem;
    font-size: 0.85rem;
    color: #b79cc9;
    opacity: 0.82;
  }

  .stage-summary {
    margin: 0.9rem auto 0;
    display: inline-flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 0.45rem 0.75rem;
    padding: 0.44rem 0.9rem;
    border-radius: 999px;
    border: 1px solid rgba(189, 76, 255, 0.26);
    background: rgba(15, 5, 25, 0.78);
    color: #b79cc9;
    font-size: 0.78rem;
  }
  .stage-summary strong {
    color: #f7eaff;
    font-weight: 600;
  }
  .stage-summary-dot {
    opacity: 0.45;
  }

  /* Acrobacia ao clicar */
  .stage.do-flip svg {
    animation: bat-acrobat 0.75s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes bat-acrobat {
    0% { transform: scale(1) rotate(0deg); }
    40% { transform: scale(1.22) rotate(-180deg); filter: drop-shadow(0 0 20px #e084ff); }
    100% { transform: scale(1) rotate(-360deg); }
  }

  @media (prefers-reduced-motion: reduce) {
    .stage svg {
      transition: none;
    }
    .stage.do-flip svg {
      animation: none;
    }
  }

  /* Botão para entrar no Mini-Game + HUD e Canvas */
  .btn-play-game {
    margin-top: 1.15rem;
    display: inline-flex;
    align-items: center;
    gap: 0.6rem;
    padding: 0.68rem 1.25rem;
    border-radius: 999px;
    border: 1px solid rgba(216, 140, 255, 0.55);
    background: linear-gradient(135deg, rgba(145, 36, 224, 0.36), rgba(45, 14, 74, 0.8));
    color: #f9ecff;
    font: 600 0.88rem var(--font-sans);
    cursor: pointer;
    box-shadow: 0 8px 26px rgba(189, 76, 255, 0.25);
    transition: transform 0.18s ease, box-shadow 0.2s ease, border-color 0.2s ease;
  }

  .btn-play-game:hover {
    transform: translateY(-2px);
    border-color: #ebb4ff;
    box-shadow: 0 0 26px rgba(189, 76, 255, 0.5);
    color: #ffffff;
  }

  .btn-play-game:active {
    transform: scale(0.97);
  }

  .btn-play-badge {
    padding: 0.15rem 0.5rem;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.12);
    border: 1px solid rgba(235, 180, 255, 0.3);
    font-size: 0.72rem;
    color: #e9c8ff;
  }

  .game-section {
    width: min(94vw, 440px);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.75rem;
  }

  .game-section[hidden],
  .stage[hidden] {
    display: none;
  }

  .game-hud {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.5rem;
    padding: 0.55rem 0.85rem;
    border-radius: 14px;
    background: rgba(18, 6, 30, 0.82);
    border: 1px solid rgba(189, 76, 255, 0.35);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }

  .game-stats {
    display: flex;
    align-items: center;
    gap: 0.9rem;
    font-size: 0.8rem;
    color: #b79cc9;
  }

  .game-stats strong {
    color: #ffffff;
    font-variant-numeric: tabular-nums;
  }

  .game-hud-actions {
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }

  .game-pill-btn {
    padding: 0.35rem 0.65rem;
    border-radius: 999px;
    border: 1px solid rgba(189, 76, 255, 0.38);
    background: rgba(54, 20, 84, 0.55);
    color: #edd7ff;
    font: 500 0.74rem var(--font-sans);
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease;
  }

  .game-pill-btn:hover {
    background: rgba(105, 32, 165, 0.65);
    border-color: #d896ff;
    color: #ffffff;
  }

  .game-canvas-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 420 / 540;
    max-height: 70svh;
    border-radius: 20px;
    overflow: hidden;
    border: 1px solid rgba(189, 76, 255, 0.45);
    box-shadow: 0 22px 55px rgba(0, 0, 0, 0.85), 0 0 28px rgba(189, 76, 255, 0.22);
    background: #06020a;
  }

  .game-canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    outline: none;
    cursor: pointer;
  }

  .game-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
    text-align: center;
    background: rgba(7, 2, 12, 0.68);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    transition: opacity 0.2s ease;
  }

  .game-overlay.is-hidden {
    opacity: 0;
    pointer-events: none;
  }

  .game-overlay-eyebrow {
    padding: 0.2rem 0.65rem;
    border-radius: 999px;
    border: 1px solid rgba(216, 140, 255, 0.45);
    background: rgba(189, 76, 255, 0.18);
    color: #ebbfff;
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  .game-overlay-title {
    margin: 0.65rem 0 0.35rem;
    font: 600 1.45rem/1.2 var(--font-sans);
    color: #ffffff;
  }

  .game-combo-pill {
    padding: 0.14rem 0.5rem;
    border-radius: 999px;
    background: linear-gradient(135deg, rgba(215, 114, 255, 0.32), rgba(155, 48, 234, 0.48));
    border: 1px solid rgba(235, 180, 255, 0.55);
    color: #ffffff;
    font-size: 0.72rem;
    font-weight: 600;
    box-shadow: 0 0 12px rgba(215, 114, 255, 0.45);
  }

  .game-combo-pill[hidden],
  .game-overlay-rank[hidden] {
    display: none;
  }

  .game-overlay-rank {
    margin: 0.1rem 0 0.45rem;
    padding: 0.25rem 0.75rem;
    border-radius: 999px;
    border: 1px solid rgba(246, 236, 255, 0.35);
    background: linear-gradient(135deg, rgba(246, 245, 255, 0.14), rgba(189, 76, 255, 0.2));
    color: #f6ecff;
    font-size: 0.76rem;
    font-weight: 600;
    letter-spacing: 0.02em;
  }

  .game-overlay-sub {
    margin: 0 0 1.2rem;
    max-width: 280px;
    font-size: 0.85rem;
    line-height: 1.45;
    color: #c9b3dc;
  }

  .game-overlay-btn {
    padding: 0.7rem 1.45rem;
    border-radius: 999px;
    border: 1px solid rgba(235, 180, 255, 0.6);
    background: linear-gradient(135deg, #9b30ea, #61129c);
    color: #ffffff;
    font: 600 0.9rem var(--font-sans);
    cursor: pointer;
    box-shadow: 0 0 24px rgba(189, 76, 255, 0.45);
    transition: transform 0.15s ease, box-shadow 0.2s ease;
  }

  .game-overlay-btn:hover {
    transform: scale(1.04);
    box-shadow: 0 0 32px rgba(215, 114, 255, 0.7);
  }
</style>
</head>
<body>
<div class="stardust" aria-hidden="true"></div>
<main>
  <div class="nav-top">
    <a href="index.html" class="btn-back">
      <span aria-hidden="true">←</span>
      <span>Voltar ao perfil</span>
    </a>
  </div>

  <div class="stage" id="bat-stage" title="Clique para uma acrobacia!">
    <svg id="morcego-svg" class="bat-svg" viewBox="0 0 440 250" role="img" aria-label="Morcego ASTERX de contorno roxo e asas angulares">
      <ellipse id="sombra" cx="220" cy="216" rx="62" ry="6" fill="#060309" opacity=".55"/>
      <g id="morcego">
        <path id="rastro" fill="none" stroke="#dc87ff" stroke-width="2.4" stroke-linecap="round" opacity="0"/>
        <path id="silhueta" fill="#1b0b29" stroke="#d749ff" stroke-width="4" stroke-linejoin="round"
          d="M220 192 C182 148 150 114 115 141 Q92 100 32 146 L47 98 L106 31 L179 78 L184 32 L202 56 H238 L256 32 L261 78 L334 31 L393 98 L408 146 Q348 100 325 141 C290 114 258 148 220 192Z"/>
        <path id="olhos" fill="#f9d9ff" d="m191 80 16 10-11-1zm58 0-16 10 11-1z"/>
      </g>
    </svg>
    <p class="hint-tap">✦ Clique ou toque no morcego para uma acrobacia</p>
    <div class="stage-summary" id="stage-summary">
      <span>Recorde: <strong id="stage-best">0 pts</strong></span>
      <span class="stage-summary-dot" aria-hidden="true">•</span>
      <span id="stage-rank">Patente: Aprendiz da Noite</span>
    </div>
    <button type="button" class="btn-play-game" id="btn-open-game">
      <span>✦ Jogar: Caçada na Madrugada</span>
      <span class="btn-play-badge" id="btn-open-game-best">Arcade</span>
    </button>
  </div>

  <section class="game-section" id="game-section" hidden aria-label="Mini-game Caçada na Madrugada">
    <div class="game-hud">
      <div class="game-stats">
        <span>Pontos: <strong id="game-score">0</strong></span>
        <span>Recorde: <strong id="game-best">0</strong></span>
        <span class="game-combo-pill" id="game-combo" hidden>x2</span>
      </div>
      <div class="game-hud-actions">
        <button type="button" class="game-pill-btn" id="btn-mute-game" aria-pressed="true">Som: On</button>
        <button type="button" class="game-pill-btn" id="btn-close-game">Mascote</button>
      </div>
    </div>

    <div class="game-canvas-wrap">
      <canvas class="game-canvas" id="game-canvas" width="420" height="540"></canvas>
      <div class="game-overlay" id="game-overlay">
        <span class="game-overlay-eyebrow" id="game-overlay-eyebrow">Mini-Game</span>
        <h2 class="game-overlay-title" id="game-overlay-title">Caçada na Madrugada</h2>
        <span class="game-overlay-rank" id="game-overlay-rank" hidden></span>
        <p class="game-overlay-sub" id="game-overlay-sub">Toque, clique ou aperte Espaço para voar pelos portais e coletar cristais (+3).</p>
        <button type="button" class="game-overlay-btn" id="game-overlay-btn">Começar voo</button>
      </div>
    </div>
  </section>
</main>
<script type="module" src="./bat.js"></script>
<script type="module" src="./bat-game.js"></script>
</body>
</html>
